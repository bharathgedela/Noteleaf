name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/Noteleaf-Setup.exe
          if-no-files-found: error

  draft:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # Apple signing keys stay on the maintainer's Mac. Never publish unsigned
      # macOS assets or make this draft public before local notarization checks.
      - name: Prepare private release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/Noteleaf-Setup.exe --draft --verify-tag --generate-notes --title "Noteleaf $RELEASE_TAG"
