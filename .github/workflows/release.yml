name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/Noteleaf-Setup.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            release/Noteleaf-arm64.dmg
            release/Noteleaf-arm64.zip
          if-no-files-found: error

  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: |
            release/Noteleaf-x64.dmg
            release/Noteleaf-x64.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Noteleaf-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "Noteleaf $RELEASE_TAG"
      - name: Publish raw-host Windows fallback
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir installer-fallback-files
          split -b 25m -d -a 3 --additional-suffix=.bin \
            release-assets/Noteleaf-Setup.exe \
            installer-fallback-files/Noteleaf-Setup.exe.part
          find installer-fallback-files -maxdepth 1 -type f -name '*.bin' -printf '%f\n' \
            | sort > installer-fallback-files/Noteleaf-Setup.parts.txt
          cp release-assets/SHA256SUMS.txt installer-fallback-files/SHA256SUMS.txt
          printf 'Fallback download parts for Noteleaf %s. Use the supported installer script on the main branch.\n' \
            "$RELEASE_TAG" > installer-fallback-files/README.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan installer-fallback-next
          git rm -rf .
          mv installer-fallback-files/* .
          git add README.md SHA256SUMS.txt Noteleaf-Setup.parts.txt Noteleaf-Setup.exe.part*.bin
          git commit -m "Publish Windows installer fallback for $RELEASE_TAG"
          git push --force origin HEAD:installer-fallback
